<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=1280,H=720,BEDROCK=H-34,BASE_R=96,ZONE_L=118,ZONE_R=300,GRAV=420;
const FONT='system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const terrain=new Float32Array(W),dug=new Uint8Array(W),origTerrain=new Float32Array(W);
const far1=new Float32Array(W/4+1),far2=new Float32Array(W/4+1);
let G=null,keys={},tDirty=true,touchMode=(typeof matchMedia==='function'&&matchMedia('(pointer:coarse)').matches);
/* ---------- 에셋 (선택) ---------- */
const AS=window.ASSETS||null,IMG={},BGI=[];
if(AS){for(const k in AS.img){const i=new Image();i.src=AS.img[k];IMG[k]=i;}AS.bg.forEach((u,n)=>{const i=new Image();i.src=u;BGI[n]=i;});}
function ok(i){return !!(i&&(i.isSprite||(i.complete&&i.naturalWidth>0)));}
let AC=null,muted=false;const BUF={},lastPlay={};
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  OUTG=AC.createGain();OUTG.gain.value=0.7;try{const cp=AC.createDynamicsCompressor();OUTG.connect(cp);cp.connect(AC.destination);}catch(e){OUTG.connect(AC.destination);}
  if(AS)for(const k in AS.snd){try{const b=atob(AS.snd[k].split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);AC.decodeAudioData(u.buffer).then(x=>{BUF[k]=x;}).catch(()=>{});}catch(e){}}
}
function sfx(k,vol,gap){if(!AC||muted)return;if(AC.state==='suspended')AC.resume();const now=AC.currentTime;if(lastPlay[k]!==undefined&&now-lastPlay[k]<(gap||0.06))return;lastPlay[k]=now;vol=vol||0.5;try{if(BUF[k]){const s=AC.createBufferSource(),gn=AC.createGain();s.buffer=BUF[k];gn.gain.value=vol;s.connect(gn);gn.connect(OUTG);s.start();}else if(SYN[k])SYN[k](vol,now+0.005);}catch(e){}}
/* ---------- 오리지널 스프라이트 (코드로 그림) ---------- */
const OL='#22192a';
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function mk(key,w,h,fn,sc){sc=sc||2;const c=mkCanvas(Math.ceil(w*sc),Math.ceil(h*sc)),g=c.getContext('2d');if(!g)return;g.scale(sc,sc);g.lineJoin='round';g.lineCap='round';fn(g,w,h);c.isSprite=1;IMG[key]=c;}
function pth(g,pts){g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.closePath();}
function rrp(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,r,0,Math.PI*2);}
function ell(g,x,y,rx,ry){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);}
function Pf(g,fill,lw){g.fillStyle=fill;g.fill();g.lineWidth=lw||2.2;g.strokeStyle=OL;g.stroke();}
function shine(g,x,y,rx,ry){ell(g,x,y,rx,ry);g.fillStyle='rgba(255,255,255,0.38)';g.fill();}
function eye(g,x,y,r,dx){circ(g,x,y,r);Pf(g,'#fff',1.6);circ(g,x+dx*r*0.33,y+0.12*r,r*0.52);g.fillStyle=OL;g.fill();circ(g,x+dx*r*0.33-r*0.16,y-r*0.12,r*0.17);g.fillStyle='#fff';g.fill();}
function brow(g,x,y,r){g.strokeStyle=OL;g.lineWidth=2.6;g.beginPath();g.moveTo(x-r*1.05,y-r*0.95);g.lineTo(x+r*1.05,y-r*1.65);g.stroke();}
function wheel(g,x,y,r,f,col){circ(g,x,y,r);Pf(g,col||'#8d8b96',1.4);const a=f*0.9+x*0.1;g.strokeStyle=OL;g.lineWidth=1.2;g.beginPath();g.moveTo(x+Math.cos(a)*r*0.7,y+Math.sin(a)*r*0.7);g.lineTo(x-Math.cos(a)*r*0.7,y-Math.sin(a)*r*0.7);g.stroke();}
function star(g,x,y,r1,r2,n){g.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=i*Math.PI/n-Math.PI/2;i?g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r):g.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}g.closePath();}

function drawPlayerBody(g,f){
  g.strokeStyle=OL;g.lineWidth=2;g.beginPath();g.moveTo(16,25);g.lineTo(12,5);g.stroke();
  pth(g,[12,5,24,8.5,12,12.5]);Pf(g,'#ffd23f',1.6);

  for(let i=0;i<5;i++)wheel(g,13+i*11.5,43,4.2,f);
  pth(g,[4,38,12,24,60,24,70,38]);Pf(g,'#2fb38a');
  g.fillStyle='#ffd23f';g.fillRect(14,30,46,3.5);
  shine(g,30,27,14,2);
  g.beginPath();g.arc(36,24,15,Math.PI,0);g.closePath();Pf(g,'#26a07a');
  rrp(g,36,13,17,8,4);Pf(g,'#1d2b4a',1.6);
  ell(g,41,17,2.2,2.6);g.fillStyle='#7ff3ff';g.fill();ell(g,48,17,2.2,2.6);g.fill();
  shine(g,29,15,6,2);
}
function drawBarrel(g,x,y,a,len){g.save();g.translate(x,y);g.rotate(-a);rrp(g,0,-4.5,len,9,3);Pf(g,'#1e7d60',2);rrp(g,len-6,-6,7,12,2);Pf(g,'#ffd23f',2);g.restore();}
function buildSprites(){
  for(let f=0;f<2;f++)mk('p'+f,72,52,g=>drawPlayerBody(g,f*1.6));

    ell(g,12,37-(f?3:0),5,2.5);Pf(g,'#3a3940',1.6);ell(g,24,37-(f?0:3),5,2.5);Pf(g,'#3a3940',1.6);
    g.strokeStyle=OL;g.lineWidth=2;g.beginPath();g.moveTo(24,10);g.lineTo(27,4);g.stroke();circ(g,27,4,2.6);Pf(g,'#ff5a5a',1.4);
    ell(g,18,20,15,12);Pf(g,'#8a5cd6');ell(g,19,26,8,4);g.fillStyle='#b79af0';g.fill();
    eye(g,12,18,5.5,-1);brow(g,12,18,5.5);shine(g,23,13,6,2.3);
  });
  // 돌격 바퀴 로봇
  for(let f=0;f<2;f++)mk('e_runner'+f,38,34,g=>{
    g.fillStyle='rgba(160,160,170,0.6)';circ(g,33,22,3);g.fill();circ(g,36,17,2);g.fill();
    wheel(g,19,25,8,f*2,'#4a4a52');
    pth(g,[5,19,13,6,31,9,32,21,10,24]);Pf(g,'#f08a3a');
    g.fillStyle='#fff3c4';g.fillRect(16,8,12,3);
    eye(g,13,14,5,-1);brow(g,13,14,5);shine(g,24,12,5,1.8);

  // 비행 드론
  for(let f=0;f<2;f++)mk('e_flyer'+f,48,36,g=>{
    g.strokeStyle=OL;g.lineWidth=2.4;g.beginPath();g.moveTo(10,10);g.lineTo(38,10);g.stroke();
    const rw=f?14:7;ell(g,9,7,rw,2.2);g.fillStyle='rgba(220,230,240,0.85)';g.fill();ell(g,39,7,rw,2.2);g.fill();
    rrp(g,7,6,4,6,1.5);Pf(g,'#4a4a52',1.4);rrp(g,37,6,4,6,1.5);Pf(g,'#4a4a52',1.4);
    g.strokeStyle=OL;g.lineWidth=2;g.beginPath();g.moveTo(18,29);g.lineTo(15,34);g.moveTo(28,29);g.lineTo(31,34);g.stroke();
    circ(g,24,20,12);Pf(g,'#e0508a');eye(g,19,19,6,-1);brow(g,19,19,6);shine(g,28,14,5,2);

  // 중전차
  for(let f=0;f<2;f++)mk('e_heavy'+f,66,48,g=>{

    rrp(g,18,4,28,13,6);Pf(g,'#c9573f');rrp(g,22,8,13,5,2);g.fillStyle='#ffd23f';g.fill();

  // 박격포 트럭
  for(let f=0;f<2;f++)mk('e_arty'+f,58,48,g=>{
    pth(g,[17,28,25,24,13,2,5,6]);Pf(g,'#4a4a52');rrp(g,3,1,12,7,2);Pf(g,'#2c2c32',1.8);
    rrp(g,4,24,50,14,5);Pf(g,'#d9a23a');rrp(g,34,11,18,15,4);Pf(g,'#e8b955');
    rrp(g,37,14,11,8,3);Pf(g,'#1d2b4a',1.4);eye(g,41.5,18,3.6,-1);
    wheel(g,15,40,7,f*2,'#4a4a52');wheel(g,44,40,7,f*2,'#4a4a52');
    g.fillStyle='#a8761d';g.fillRect(8,30,24,3);shine(g,24,27,12,1.8);

  // 방패병
  for(let f=0;f<2;f++)mk('e_shield'+f,44,42,g=>{
    rrp(g,18,29-(f?3:0),7,10,3);Pf(g,'#2f6b37',1.8);rrp(g,28,29-(f?0:3),7,10,3);Pf(g,'#2f6b37',1.8);
    ell(g,26,22,14,12);Pf(g,'#4fa05a');eye(g,21,19,5.2,-1);brow(g,21,19,5.2);shine(g,31,15,5,2);
    rrp(g,2,6,13,32,4);Pf(g,'#9aa3ad');g.fillStyle='#ffd23f';for(let i=0;i<3;i++){g.save();rrp(g,2,6,13,32,4);g.clip();g.translate(0,10+i*10);g.rotate(-0.5);g.fillRect(-4,0,26,3.5);g.restore();}
    rrp(g,2,6,13,32,4);g.lineWidth=2.2;g.strokeStyle=OL;g.stroke();shine(g,7,12,2.5,5);

  // 보스 4종
  const BOSSDEF=[{hull:'#c0392b',top:'#e05a46',w:'drill'},{hull:'#6d4bd1',top:'#8e6cf0',w:'twin'},{hull:'#2e7fb8',top:'#4ba3dc',w:'laser'},{hull:'#3a2a2a',top:'#5a3a32',w:'horn'}];
  BOSSDEF.forEach((b,i)=>mk('b'+i,132,104,g=>{
    if(b.w==='drill'){pth(g,[2,62,30,46,30,78]);Pf(g,'#b8bcc6');g.strokeStyle=OL;g.lineWidth=1.6;for(let k=0;k<4;k++){g.beginPath();g.moveTo(8+k*6,58-k*3);g.lineTo(10+k*6,66+k*3);g.stroke();}}
    if(b.w==='twin'){rrp(g,0,28,46,9,3);Pf(g,'#3d2e66');rrp(g,4,44,42,9,3);Pf(g,'#3d2e66');}
    if(b.w==='laser'){rrp(g,4,36,36,12,5);Pf(g,'#1f4d6e');circ(g,8,42,6);Pf(g,'#7ff3ff',1.8);}

    rrp(g,8,74,118,26,13);Pf(g,'#34333a',2.6);for(let k=0;k<7;k++)wheel(g,20+k*16,87,7,k);
    pth(g,[12,76,24,34,112,30,126,76]);Pf(g,b.hull,2.8);
    if(b.w==='horn'){g.strokeStyle='#ff7a33';g.lineWidth=2.4;g.beginPath();g.moveTo(40,50);g.lineTo(52,62);g.lineTo(48,72);g.moveTo(90,44);g.lineTo(84,58);g.lineTo(96,68);g.stroke();
      pth(g,[44,24,36,4,56,22]);Pf(g,'#e8e0d0');pth(g,[92,22,104,2,104,24]);Pf(g,'#e8e0d0');}
    rrp(g,38,14,62,30,14);Pf(g,b.top,2.6);
    if(b.w==='laser'){pth(g,[69,16,62,6,69,0,76,6]);Pf(g,'#9ff6ff',2);}
    eye(g,56,30,8,-1);eye(g,78,30,8,-1);
    g.strokeStyle=OL;g.lineWidth=3.4;g.beginPath();g.moveTo(46,18);g.lineTo(64,24);g.moveTo(88,18);g.lineTo(70,24);g.stroke();
    g.fillStyle='rgba(0,0,0,0.18)';g.fillRect(20,60,100,4);shine(g,84,40,24,3.5);
  }));
  // 탄·아이콘
  mk('w3',24,24,g=>{g.strokeStyle='#8b5a2b';g.lineWidth=2.4;g.beginPath();g.moveTo(15,8);g.quadraticCurveTo(18,3,20,4);g.stroke();star(g,20,4,4,1.6,5);g.fillStyle='#ffd23f';g.fill();circ(g,11,14,8.5);Pf(g,'#2b2b33');shine(g,8,10,3,2);});
  mk('w4',32,14,g=>{pth(g,[24,4,31,0,28,6]);Pf(g,'#e2463c',1.6);pth(g,[24,10,31,14,28,8]);Pf(g,'#e2463c',1.6);rrp(g,6,3.5,20,7,3.5);Pf(g,'#e8e8f0',1.8);pth(g,[0,7,8,3,8,11]);Pf(g,'#e2463c',1.8);});
  mk('w6',28,14,g=>{pth(g,[20,4,27,1,24,6]);Pf(g,'#2f6b37',1.6);pth(g,[20,10,27,13,24,8]);Pf(g,'#2f6b37',1.6);rrp(g,4,3.5,19,7,3.5);Pf(g,'#4fbf6a',1.8);pth(g,[0,7,6,3.5,6,10.5]);Pf(g,'#ffd23f',1.6);circ(g,9,7,1.6);g.fillStyle=OL;g.fill();});
  mk('s3',22,22,g=>{star(g,11,11,10,6.5,8);Pf(g,'#e24b4a',1.8);circ(g,11,11,4);g.fillStyle='#ffd0c0';g.fill();});
  mk('w10',46,20,g=>{pth(g,[10,3,46,10,10,17]);g.fillStyle='rgba(180,130,255,0.55)';g.fill();pth(g,[10,6,34,10,10,14]);g.fillStyle='rgba(230,210,255,0.8)';g.fill();circ(g,10,10,8);Pf(g,'#c79bff',1.8);circ(g,9,9,3.5);g.fillStyle='#fff';g.fill();});
  mk('w9',18,12,g=>{g.beginPath();g.arc(9,10,7,Math.PI,0);g.closePath();Pf(g,'#3a3a42',1.6);rrp(g,1,9,16,3,1.5);Pf(g,'#55555e',1.2);});
  mk('s10',20,32,g=>{pth(g,[7,25,10,32,13,25]);g.fillStyle='#ffb43a';g.fill();pth(g,[4,22,1,28,7,24]);Pf(g,'#e2463c',1.4);pth(g,[16,22,19,28,13,24]);Pf(g,'#e2463c',1.4);rrp(g,5,8,10,17,5);Pf(g,'#d8dde6',1.8);pth(g,[5,10,10,1,15,10]);Pf(g,'#e2463c',1.8);circ(g,10,15,2.4);Pf(g,'#7ff3ff',1.2);});
  mk('coin',16,16,g=>{circ(g,8,8,7);g.fillStyle='#ffc83a';g.fill();g.lineWidth=1.6;g.strokeStyle='#a86d00';g.stroke();star(g,8,8,4,1.8,5);g.fillStyle='#fff3b0';g.fill();});
  mk('w7',34,28,g=>{for(let k=0;k<3;k++){g.save();g.translate(0,k*8);pth(g,[24,4,31,0,28,6]);Pf(g,'#e2463c',1.4);rrp(g,6,2,20,6,3);Pf(g,'#e8e8f0',1.6);pth(g,[0,5,8,2,8,8]);Pf(g,'#e2463c',1.6);g.restore();}});
  mk('w8',34,16,g=>{rrp(g,1,3,32,10,5);Pf(g,'#2aa8c8',1.8);rrp(g,4,6,26,4,2);g.fillStyle='#e8fdff';g.fill();});
  mk('w12',30,30,g=>{g.lineWidth=3;for(let k=0;k<3;k++){g.strokeStyle=['#5fd38a','#ffb43a','#7ff3ff'][k];g.beginPath();g.arc(15,15,4+k*4.5,k*2,k*2+4.2);g.stroke();}});

function noiseBuf(){if(NB)return NB;const n=Math.floor(AC.sampleRate*1.6);NB=AC.createBuffer(1,n,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return NB;}
function envG(t0,a,peak,dur){const g=AC.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);g.connect(OUTG);return g;}
function tone(type,f0,f1,dur,vol,t0){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);o.connect(envG(t0,0.006,vol,dur));o.start(t0);o.stop(t0+dur+0.05);}
function noise(dur,vol,t0,ft,f0,f1,q){const s=AC.createBufferSource();s.buffer=noiseBuf();const f=AC.createBiquadFilter();f.type=ft;f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);if(q)f.Q.value=q;s.connect(f);f.connect(envG(t0,0.006,vol,dur));s.start(t0,Math.random()*0.4);s.stop(t0+dur+0.05);}

function genTerrain(){

    const h=48*Math.sin(x*0.0075+p1)+26*Math.sin(x*0.019+p2)+12*Math.sin(x*0.043+p3);
    terrain[x]=560-k*(h+30);dug[x]=0;
  }
  origTerrain.set(terrain);tDirty=true;
  const q1=rand(0,6.28),q2=rand(0,6.28);
  for(let i=0;i<far1.length;i++){const x=i*4;far1[i]=380+40*Math.sin(x*0.004+q1)+18*Math.sin(x*0.013+q2);far2[i]=440+30*Math.sin(x*0.006+q2)+14*Math.sin(x*0.017+q1);}
}
function gy(x){return terrain[clamp(x|0,0,W-1)];}
function dig(cx,cy,r){
  tDirty=true;
  for(let x=Math.max(BASE_R+4,Math.ceil(cx-r));x<=Math.min(W-1,Math.floor(cx+r));x++){
    const bottom=cy+Math.sqrt(r*r-(x-cx)*(x-cx));
    if(terrain[x]<bottom){terrain[x]=Math.min(BEDROCK,bottom);dug[x]=1;}
  }
  for(let x=Math.max(BASE_R+6,Math.ceil(cx-r)-3);x<=Math.min(W-3,Math.floor(cx+r)+3);x++){
    const m=Math.min(terrain[x-2],terrain[x+2]);if(terrain[x]<m-6){terrain[x]=m;dug[x]=1;}
  }
}

  if(G.parts.length<420){
    const n=2+Math.floor(r/16);for(let i=0;i<n;i++)G.parts.push({kind:'smoke',x:x+rand(-r/3,r/3),y:y+rand(-r/3,r/4),vx:rand(-18,18)+G.wind*4,vy:rand(-55,-20),t:0,life:rand(0.6,1.1),size:r*rand(0.25,0.45)});
    if(digIt)for(let i=0;i<6;i++)G.parts.push({kind:'dirt',x,y,vx:rand(-170,170),vy:rand(-280,-90),g:650,t:0,life:rand(0.5,0.9),size:rand(2,4.5),col:Math.random()<0.5?'#6b4f30':'#9a7a50'});
  }
  G.fx.push({x,y,r,t:0,life:0.35,kind:owner==='p'?'boom':'eboom'});
  G.shake=Math.max(G.shake,Math.min(7,r/9));
}
function explodeShell(s,direct){
  if(s.owner==='p'){
    let dmg=s.dmg;
    if(direct&&s.kind==='cannon'){dmg*=1.5;addText(s.x,s.y-26,'직격!','#FAC775');}
    explode(s.x,s.y,s.r,dmg,'p',s.kind!=='homing',s.kind==='cannon');
    if(s.kind==='cannon'&&G.evolved.cannon){
      [0.75,0.5,0.25].forEach((m,i)=>G.later.push({t:0.13*(i+1),fn:()=>explode(s.x+rand(-8,8),gy(s.x),s.r*(1-0.15*(i+1)),s.dmg*m,'p',true,true)}));
    }
  }else explode(s.x,s.y,s.r,s.dmg,'e',true);
}

function updShells(dt){
  const ax=G.wind*12,T=G.tank;
  for(let i=G.shells.length-1;i>=0;i--){
    const s=G.shells[i];let dead=false;const steps=3,h=dt/steps;
    for(let k=0;k<steps&&!dead;k++){
      if(s.kind==='homing'){
        if(!s.target||s.target.hp<=0)s.target=pickEnemy();
        if(s.target){const want=Math.atan2(s.target.y-s.y,s.target.x-s.x),cur=Math.atan2(s.vy,s.vx);let d=want-cur;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;const na=cur+clamp(d,-5*h,5*h),sp=Math.hypot(s.vx,s.vy);s.vx=Math.cos(na)*sp;s.vy=Math.sin(na)*sp;}
      }
      if(s.wind)s.vx+=ax*h;
      if(s.grav)s.vy+=GRAV*h*(s.gmul||1);
      s.x+=s.vx*h;s.y+=s.vy*h;s.life-=h;
      if(s.x<-60||s.x>W+80||s.y>H){dead=true;break;}
      if(s.life<=0){explodeShell(s,false);dead=true;break;}
      if(s.y>=gy(s.x)){explodeShell(s,false);dead=true;break;}
      if(s.owner==='p'){
        for(const e of G.enemies){if(e.hp>0&&dist(s.x,s.y,e.x,e.y)<e.sz+4){explodeShell(s,true);dead=true;break;}}
      }else{
        if(T.hp>0&&dist(s.x,s.y,T.x,gy(T.x)-12)<22){tankDirectHit(s);explodeShell(s,true);dead=true;}
        else if(s.x<BASE_R&&s.y>gy(40)-110){explodeShell(s,true);dead=true;}
      }
    }
    if(dead){G.shells.splice(i,1);continue;}
    s.trail.push(s.x,s.y);if(s.trail.length>28)s.trail.splice(0,2);
  }
}

function updEnemies(dt){
  const T=G.tank;
  for(const e of G.enemies){
    if(e.hp<=0)continue;
    e.hit=Math.max(0,e.hit-dt);
    if(e.knock){e.x=Math.min(W+60,e.x+e.knock*dt);e.knock*=Math.pow(0.04,dt);if(e.knock<5)e.knock=0;}
    if(e.fly){
      if(e.x-e.sz<BASE_R)G.base.hp-=e.dps*dt;else e.x-=e.spd*dt;
      e.y=e.baseY+Math.sin(G.t*2+e.ph)*10;continue;
    }
    const blocked=T.hp>0&&e.x>T.x&&e.x-e.sz<T.x+24;
    const atBase=e.x-e.sz<BASE_R;
    const holding=(e.arty||e.boss)&&e.x<=e.stopX;
    if(blocked)hurtTank(e.dps*0.6*dt);
    else if(atBase)G.base.hp-=e.dps*dt;
    else if(!holding){
      const up=gy(e.x)-gy(e.x-6);
      const slow=up>0?clamp(1-up*0.12,0.22,1):1;
      e.x-=e.spd*slow*dt;
    }
    e.y=gy(e.x)-e.sz;
    if(e.arty||e.boss){e.fireT-=dt;if(e.fireT<=0&&e.x<W-10){e.fireT=e.boss?4.8:rand(4,5.5);enemyFire(e);}}
  }
  if(G.base.hp<=0){G.base.hp=0;gameOver('기지가 함락되었습니다');}
}
function enemyFire(e){
  sfx('efire',0.25,0.25);
  const T=G.tank,shots=e.boss?3:1;
  for(let i=0;i<shots;i++){
    const tx=(e.boss&&i===2)?60:T.x+rand(-30,30),dx=Math.max(40,e.x-tx),th=rand(0.75,0.95);
    const v=Math.sqrt(dx*GRAV/Math.sin(2*th))*rand(0.95,1.05);
    G.shells.push({big:e.boss?1:0,x:e.x-e.sz*0.5,y:e.y-e.sz,vx:-Math.cos(th)*v,vy:-Math.sin(th)*v,kind:'eshell',owner:'e',dmg:e.boss?14:9,r:e.boss?36:28,wind:1,grav:1,life:12,trail:[]});
  }
}

function nearestEnemy(){let b=null;for(const e of G.enemies){if(e.hp>0&&(!b||e.x<b.x))b=e;}return b;}
function pickEnemy(){const a=G.enemies.filter(e=>e.hp>0);return a.length?a[(Math.random()*a.length)|0]:null;}
function updWeapons(dt){
  if(G.tank.hp<=0)return;
  const any=G.enemies.some(e=>e.hp>0);
  for(const k in G.weapons){
    if(k==='cannon')continue;
    G.cds[k]=(G.cds[k]===undefined?0.6:G.cds[k])-dt;
    if(G.cds[k]<=0&&any){G.cds[k]=WD[k].cd*cdMul();fireAuto(k,G.weapons[k]);}
  }
}
function fireAuto(k,l){
  const m=muzzle(),dm=dmgMul()*(1+0.25*(l-1));
  if(k==='rocket'){
    const t=nearestEnemy();if(!t)return;sfx('rocket',0.22,0.2);const n=G.evolved.rocket?9:3+(l>=3)+(l>=5);
    const a0=Math.atan2(t.y-m.by,t.x-m.bx)-0.1;
    for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*0.06;G.later.push({t:i*0.05,fn:()=>G.shells.push({x:m.bx,y:m.by-6,vx:Math.cos(a)*560,vy:Math.sin(a)*560,kind:'rocket',owner:'p',dmg:13*dm,r:24*radMul(),wind:0,grav:1,gmul:0.15,life:4,trail:[]})});}
  }else if(k==='homing'){
    const n=(1+Math.floor((l-1)/2))*(G.evolved.homing?3:1);sfx('homing',0.18,0.25);
    for(let i=0;i<n;i++){const a=-Math.PI/2+rand(-0.6,0.6);G.later.push({t:i*0.08,fn:()=>G.shells.push({x:m.bx,y:m.by-8,vx:Math.cos(a)*330,vy:Math.sin(a)*330,kind:'homing',owner:'p',dmg:15*dm,r:20*radMul(),wind:0,grav:0,life:4,target:pickEnemy(),trail:[]})});}
  }else if(k==='laser'){
    const ts=[nearestEnemy()];sfx('laser',0.25,0.1);if(l>=4){const p=pickEnemy();if(p&&p!==ts[0])ts.push(p);}
    for(const t of ts){
      if(!t)continue;const a=Math.atan2(t.y-m.by,t.x-m.bx),c=Math.cos(a),s=Math.sin(a);
      for(const e of G.enemies){if(e.hp<=0)continue;const dx=e.x-m.bx,dy=e.y-m.by,al=dx*c+dy*s;if(al>0&&Math.abs(-dx*s+dy*c)<e.sz+7)damage(e,30*dm);}
      G.beams.push({x:m.bx,y:m.by,a,t:0.18});
    }
  }else if(k==='sat'){
    const n=G.evolved.sat?6:1+Math.floor(l/2);
    for(let i=0;i<n;i++){const t=pickEnemy();const x=t?clamp(t.x-(t.fly?t.spd:t.spd)*0.75,BASE_R+40,W-10):rand(400,1200);G.strikes.push({x,t:0.75+i*0.06,dmg:55*dm,r:52*radMul()});}
  }else if(k==='mine'){
    const max=5+l*2,n=l>=4?2:1;
    for(let i=0;i<n&&G.mines.length<max;i++)G.mines.push({x:rand(330,820),dmg:48*dm,r:46*radMul(),arm:0.6});
  }else if(k==='tornado'){
    const n=l>=4?2:1;sfx('tornado',0.35,0.3);
    for(let i=0;i<n;i++)G.later.push({t:i*0.6,fn:()=>G.tornados.push({x:G.tank.x+40,life:3.2+0.3*l,r:40+4*l,dps:10*dm})});
  }
}

function updTank(dt){
  const T=G.tank;if(T.hp<=0)return;
  let mv=0;if(keys.ArrowLeft||keys.KeyA||keys.TouchL)mv-=1;if(keys.ArrowRight||keys.KeyD||keys.TouchR)mv+=1;
  T.moving=false;
  if(mv&&!T.charging){const nx=clamp(T.x+mv*80*dt,ZONE_L,ZONE_R);if(gy(T.x)-gy(nx)<6){T.x=nx;T.moving=true;}}
  const as=(keys.ShiftLeft||keys.ShiftRight)?12:50;
  if(keys.ArrowUp||keys.KeyW)T.angle=clamp(T.angle+as*dt,0,88);
  if(keys.ArrowDown||keys.KeyS)T.angle=clamp(T.angle-as*dt,0,88);
  const now=performance.now();
  if(keys.TouchU&&now-keys.TouchU>280)T.angle=clamp(T.angle+28*dt,0,88);
  if(keys.TouchD&&now-keys.TouchD>280)T.angle=clamp(T.angle-28*dt,0,88);
  if(T.reload>0)T.reload=Math.max(0,T.reload-dt*(T.moving?0.5:1));
  if(T.charging)T.power=Math.min(1,T.power+dt/1.4);
  T.recoil=Math.max(0,(T.recoil||0)-dt*30);T.flash=Math.max(0,(T.flash||0)-dt);
}
function updOrbs(dt){
  const T=G.tank,tx=T.x,ty=gy(T.x)-20;
  for(let i=G.orbs.length-1;i>=0;i--){
    const o=G.orbs[i];o.t+=dt;
    if(o.t<0.35){o.y-=40*dt;continue;}
    const sp=300+o.t*700,dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);
    if(d<18||sp*dt>=d){G.orbs.splice(i,1);gainXp(o.v);sfx('coin',0.25,0.04);continue;}
    o.x+=dx/d*sp*dt;o.y+=dy/d*sp*dt;
  }
}
function gainXp(v){G.xp+=v*(1+0.15*P('collect'));while(G.xp>=G.xpNeed){G.xp-=G.xpNeed;G.level++;G.xpNeed=Math.round(4+G.level*2.6);G.pendingLv++;}}
function updMisc(dt){
  for(const p of G.parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=p.g*dt;}G.parts=G.parts.filter(p=>p.t<p.life);
  for(const f of G.fx)f.t+=dt;G.fx=G.fx.filter(f=>f.t<f.life);
  for(const t of G.texts)t.t+=dt;G.texts=G.texts.filter(t=>t.t<0.8);
  for(const b of G.beams)b.t-=dt;G.beams=G.beams.filter(b=>b.t>0);
  for(let i=G.strikes.length-1;i>=0;i--){const s=G.strikes[i];s.t-=dt;if(s.t<=0){G.strikes.splice(i,1);const y=gy(s.x);sfx('sat',0.3,0.1);G.fx.push({x:s.x,y,r:s.r,t:0,life:0.3,kind:'sky'});explode(s.x,y,s.r,s.dmg,'p',true,false);}}
  for(let i=G.mines.length-1;i>=0;i--){const m=G.mines[i];m.arm-=dt;if(m.arm>0)continue;if(G.enemies.some(e=>e.hp>0&&!e.fly&&Math.abs(e.x-m.x)<e.sz+8)){G.mines.splice(i,1);explode(m.x,gy(m.x),m.r,m.dmg,'p',true,false);}}
  for(let i=G.tornados.length-1;i>=0;i--){
    const o=G.tornados[i];o.life-=dt;o.x+=170*dt;
    if(o.life<=0||o.x>W+40){G.tornados.splice(i,1);continue;}
    for(const e of G.enemies){if(e.hp>0&&Math.abs(e.x-o.x)<o.r+e.sz&&e.y>gy(o.x)-220){e.knock=Math.max(e.knock,e.boss?30:200);damage(e,o.dps*dt);}}
  }
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
}

function update(dt){
  if(G.state!=='play')return;
  G.hurtFlash=Math.max(0,G.hurtFlash-dt*1.6);G.kickX*=Math.pow(0.0005,dt);G.kickY*=Math.pow(0.0005,dt);
  if(G.hitstop>0){G.hitstop-=dt;G.shake=Math.max(0,G.shake-dt*10);return;}
  G.t+=dt;
  for(let i=G.later.length-1;i>=0;i--){const l=G.later[i];l.t-=dt;if(l.t<=0){G.later.splice(i,1);l.fn();}}
  if(!G.boss){
    G.waveT+=dt;
    if(G.waveT>=G.waveLen&&G.wave<20){
      G.wave++;G.waveT=0;newWind();tDirty=true;G.restore=0.9;sfx(G.wave%5===0?'boss':'wind',G.wave%5===0?0.6:0.3);
      if(G.wave%5===0){spawnEnemy('boss');showBanner('웨이브 '+G.wave+' — 보스 출현!','보스를 쓰러뜨려야 다음 웨이브로 · 바람 '+windText());}
      else showBanner('웨이브 '+G.wave,'지형 복구 · 바람 '+windText());
    }
  }
  waveSpawn(dt);updTank(dt);updWeapons(dt);updShells(dt);updEnemies(dt);updMisc(dt);updOrbs(dt);
  G.enemies=G.enemies.filter(e=>e.hp>0);
  G.base.hp=Math.min(G.base.maxHp,G.base.hp+P('repair')*dt);
  if(G.restore>0){G.restore-=dt;const k=Math.min(1,dt*5);for(let x=0;x<W;x++)terrain[x]+=(origTerrain[x]-terrain[x])*k;if(G.restore<=0){terrain.set(origTerrain);dug.fill(0);}tDirty=true;}
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*(G.shake>8?30:24));
  if(G.state==='play'&&G.pendingLv>0)openCards();
}

function openCards(){sfx('levelup',0.45,0.3);G.pendingLv--;G.cards=buildCards();G.state='levelup';G.tank.charging=false;}
function buildCards(){
  const pool=[],wc=Object.keys(G.weapons).length,pc=Object.keys(G.passives).length;
  for(const k in EVO)if(WL(k)>=5&&P(EVO[k].need)>=1&&!G.evolved[k])pool.push({kind:'evo',id:k,w:1000});
  for(const k in WD){const l=WL(k);if(l>0&&l<5)pool.push({kind:'wup',id:k,w:3});else if(l===0&&wc<6)pool.push({kind:'wnew',id:k,w:2.2});}
  for(const k in PD){const l=P(k);if(l>0&&l<5)pool.push({kind:'pup',id:k,w:2});else if(l===0&&pc<6)pool.push({kind:'pnew',id:k,w:1.6});}
  const out=[];
  while(out.length<3&&pool.length){let s=0;for(const c of pool)s+=c.w;let r=Math.random()*s,idx=pool.length-1;for(let i=0;i<pool.length;i++){if((r-=pool[i].w)<0){idx=i;break;}}out.push(pool.splice(idx,1)[0]);}
  if(out.length<3)out.push({kind:'heal'});
  return out;
}
function cardInfo(c){
  if(c.kind==='evo')return{tag:'진화',title:EVO[c.id].name,sub:WD[c.id].name+' 최종 진화',desc:EVO[c.id].desc,col:'#EF9F27'};
  if(c.kind==='heal')return{tag:'보급',title:'긴급 수리',sub:'회복',desc:'탱크·기지 체력 30% 회복',col:'#5DCAA5'};
  if(c.kind[0]==='w'){const l=WL(c.id);return{tag:l?'Lv '+l+' → '+(l+1):'신규 무기',title:WD[c.id].name,sub:c.id==='cannon'?'수동 주포':'자동 발사 무기',desc:WDESC[c.id],col:'#378ADD'};}
  const l=P(c.id);return{tag:l?'Lv '+l+' → '+(l+1):'신규 패시브',title:PD[c.id],sub:'패시브',desc:PDESC[c.id]+(EVONEED(c.id)?' · 진화 재료':''),col:'#639922'};
}
function EVONEED(p){for(const k in EVO)if(EVO[k].need===p)return true;return false;}
function cardRects(){const n=G.cards.length,w=300,h=330,gap=40,x0=(W-(n*w+(n-1)*gap))/2;return G.cards.map((c,i)=>({x:x0+i*(w+gap),y:210,w,h}));}
function chooseCard(i){
  const c=G.cards&&G.cards[i];if(!c)return;sfx('select',0.5);
  if(c.kind==='evo'){G.evolved[c.id]=1;showBanner('진화!',EVO[c.id].name);}
  else if(c.kind==='heal'){G.tank.hp=Math.min(G.tank.maxHp,G.tank.hp+G.tank.maxHp*0.3);G.base.hp=Math.min(G.base.maxHp,G.base.hp+G.base.maxHp*0.3);}
  else if(c.kind[0]==='w')G.weapons[c.id]=WL(c.id)+1;
  else{G.passives[c.id]=P(c.id)+1;if(c.id==='armor'){G.tank.maxHp+=20;G.tank.hp+=20;}}
  G.cards=null;G.state='play';
  if(G.pendingLv>0)openCards();
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function txt(s,x,y,size,col,align,weight){ctx.font=(weight||500)+' '+size+'px '+FONT;ctx.fillStyle=col;ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function otxt(s,x,y,size,col,align,weight){ctx.font=(weight||500)+' '+size+'px '+FONT;ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,0.7)';ctx.lineJoin='round';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);}
function bar(x,y,w,h,f,col,label){ctx.fillStyle='rgba(0,0,0,0.5)';rr(x,y,w,h,h/2);ctx.fill();if(f>0){const fw=Math.max(h,w*clamp(f,0,1));ctx.fillStyle=col;rr(x,y,fw,h,h/2);ctx.fill();if(h>=8){ctx.fillStyle='rgba(255,255,255,0.3)';rr(x+3,y+2,Math.max(0,fw-6),h*0.32,h*0.16);ctx.fill();}}if(label)otxt(label,x+10,y+h/2+1,12,'#fff','left',500);}
function nine(img,x,y,w,h){const s=img.height,c=Math.floor(img.width/2)-1,cw=Math.min(c*h/s,w/2);ctx.drawImage(img,0,0,c,s,x,y,cw,h);ctx.drawImage(img,c,0,img.width-2*c,s,x+cw,y,Math.max(0,w-2*cw),h);ctx.drawImage(img,img.width-c,0,c,s,x+w-cw,y,cw,h);}
function gbar(x,y,w,h,f,key,col,label){
  if(ok(IMG.g_bg)&&ok(IMG[key])){nine(IMG.g_bg,x,y,w,h);if(f>0)nine(IMG[key],x,y,Math.max(h,w*clamp(f,0,1)),h);if(label)otxt(label,x+10,y+h/2+1,12,'#fff','left',500);}
  else bar(x,y,w,h,f,col,label);
}
function spr(key,x,y,h,flip,rot,alpha){const i=IMG[key];if(!ok(i))return false;const s=h/i.height,w=i.width*s;ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(flip)ctx.scale(-1,1);if(alpha!==undefined)ctx.globalAlpha=alpha;ctx.drawImage(i,-w/2,-h/2,w,h);ctx.restore();return true;}
function sprFit(key,x,y,box){const i=IMG[key];if(!ok(i))return false;const h=Math.min(box,box*i.height/i.width);return spr(key,x,y,h);}
function stage(){return G?Math.min(3,Math.floor((G.wave-1)/5)):0;}
const ESPR={grunt:['chr_crossbow',30],runner:['chr_carrottank',26],flyer:['chr_secwind',36],heavy:['chr_minelander',48],arty:['chr_multimissle',40],shield:['chr_puketank',34]};

  items.forEach((it,i)=>{const yy=104+i*22;sprFit(ICON[it[0]],34,yy,18);txt(it[1],50,yy,13,it[2],'left');});
  panel(W/2-180,14,360,56);
  if(G.boss){
    if(!spr('war_boss',W/2-122,42,26))otxt('보스전',W/2-122,42,18,'#FFB13B','center');
    gbar(W/2-78,32,244,20,G.boss.hp/G.boss.maxHp,'g_power','#E24B4A',Math.ceil(G.boss.hp)+'');
  }else{otxt('웨이브 '+G.wave+' / 20',W/2,31,17,'#fff','center');gbar(W/2-150,46,300,12,G.waveT/G.waveLen,'g_power','#EF9F27');}
  panel(W-226,14,210,64);
  txt('바람',W-210,32,13,'#ddd');otxt(G.wind===0?'없음':Math.abs(G.wind)+'',W-30,32,17,'#fff','right');
  const cx=W-118,len=G.wind*9;ctx.strokeStyle='#9FE1CB';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,32);ctx.lineTo(cx+len,32);ctx.stroke();ctx.lineCap='butt';
  if(G.wind){ctx.fillStyle='#9FE1CB';const d=Math.sign(G.wind);ctx.beginPath();ctx.moveTo(cx+len+d*9,32);ctx.lineTo(cx+len,24);ctx.lineTo(cx+len,40);ctx.fill();}
  const sec=Math.floor(G.t);txt('처치 '+G.kills+' · '+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')+(muted?' · 소리 꺼짐(M)':' · 소리(M)'),W-210,60,12,'#ddd');
  // 각도계 + 파워
  const hx=touchMode?W/2-228:16;
  panel(hx,H-112,456,96,0.55);
  const mx=hx+50,my=H-64;
  if(!spr('angle_bg',mx,my,86)){ctx.fillStyle='#1b222c';ctx.beginPath();ctx.arc(mx,my,42,0,6.3);ctx.fill();ctx.strokeStyle='#ffb13b';ctx.lineWidth=4;ctx.stroke();for(let d=0;d<=90;d+=10){const r=d*Math.PI/180,big=d%30===0;ctx.strokeStyle=big?'#fff':'rgba(255,255,255,0.4)';ctx.lineWidth=big?2.5:1.5;ctx.beginPath();ctx.moveTo(mx+Math.cos(r)*30,my-Math.sin(r)*30);ctx.lineTo(mx+Math.cos(r)*38,my-Math.sin(r)*38);ctx.stroke();}}
  const a=T.angle*Math.PI/180;
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(mx,my-34);ctx.stroke();
  ctx.strokeStyle='#ffe28a';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(mx+Math.cos(a)*34,my-Math.sin(a)*34);ctx.stroke();ctx.lineCap='butt';
  if(!spr('angle_cap',mx,my,10)){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(mx,my,5,0,6.3);ctx.fill();}
  otxt(Math.round(T.angle)+'°',mx,my+20,15,'#fff','center');
  txt(T.reload>0?(T.moving?'재장전 중 (이동 중 50% 느림)':'재장전 중'):(T.charging?'파워 충전 중 — 떼면 발사':'Space 누르고 떼서 발사'),hx+108,H-92,13,T.reload>0?'#F0997B':'#C0DD97');
  const gx=hx+108,gyy=H-74,gw=334,gh=22;
  if(ok(IMG.g_bg))nine(IMG.g_bg,gx,gyy,gw,gh);else{ctx.fillStyle='rgba(0,0,0,0.5)';rr(gx,gyy,gw,gh,6);ctx.fill();}
  if(T.reload>0){const s=cannonStats(),f=1-T.reload/s.reload;ctx.globalAlpha=0.55;if(ok(IMG.g_move))nine(IMG.g_move,gx,gyy,Math.max(gh,gw*f),gh);else{ctx.fillStyle='rgba(240,153,123,0.8)';rr(gx,gyy,gw*f,gh,6);ctx.fill();}ctx.globalAlpha=1;}
  else if(T.charging){if(ok(IMG.g_power))nine(IMG.g_power,gx,gyy,Math.max(gh,gw*T.power),gh);else{ctx.fillStyle='#EF9F27';rr(gx,gyy,Math.max(10,gw*T.power),gh,6);ctx.fill();}}
  for(let i=1;i<10;i++){ctx.fillStyle='rgba(255,255,255,0.22)';ctx.fillRect(gx+gw*i/10,gyy+5,1,gh-10);}
  if(T.lastPower>=0){const px=gx+gw*T.lastPower;ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(px,gyy-1);ctx.lineTo(px-6,gyy-9);ctx.lineTo(px+6,gyy-9);ctx.fill();}
  txt('파워',gx,gyy+gh+13,11,'#aaa','left',400);txt(Math.round((T.charging?T.power:Math.max(0,T.lastPower))*100)+'',gx+gw,gyy+gh+13,11,'#ddd','right',400);
  // 경험치
  bar(0,H-8,W,8,G.xp/G.xpNeed,'#FAC775');
  const rk=Math.min(20,G.level-1);spr('r'+rk,W/2-34,H-22,16);otxt('Lv '+G.level,W/2+4,H-21,14,'#fff','center');
}
function touchBtns(){
  const B={L:{x:24,y:H-128,w:100,h:100},R:{x:136,y:H-128,w:100,h:100},U:{x:W-356,y:H-240,w:96,h:96},D:{x:W-356,y:H-128,w:96,h:96},F:{cx:W-138,cy:H-132,r:92},P:{x:W/2+192,y:14,w:56,h:56}};
  B.M={x:W/2+256,y:14,w:56,h:56};
  return B;
}
function drawTouch(){
  const B=touchBtns(),T=G.tank,held=new Set(ptrs.values());
  const btn=(b,k,label)=>{ctx.fillStyle=held.has(k)?'rgba(255,255,255,0.32)':'rgba(16,20,26,0.38)';rr(b.x,b.y,b.w,b.h,20);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=2;rr(b.x,b.y,b.w,b.h,20);ctx.stroke();otxt(label,b.x+b.w/2,b.y+b.h/2+1,b.w>60?34:22,'#fff','center');};
  btn(B.L,'L','◀');btn(B.R,'R','▶');btn(B.U,'U','▲');btn(B.D,'D','▼');btn(B.P,'P','II');if(B.M)btn(B.M,'M',muted?'×':'♪');
  const f=B.F,s=cannonStats();
  ctx.fillStyle=held.has('F')?'rgba(239,159,39,0.55)':'rgba(16,20,26,0.4)';ctx.beginPath();ctx.arc(f.cx,f.cy,f.r,0,6.3);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.cx,f.cy,f.r,0,6.3);ctx.stroke();
  if(T.reload>0){ctx.strokeStyle='rgba(240,153,123,0.9)';ctx.lineWidth=8;ctx.beginPath();ctx.arc(f.cx,f.cy,f.r-8,-Math.PI/2,-Math.PI/2+6.283*(1-T.reload/s.reload));ctx.stroke();}
  else if(T.charging){ctx.strokeStyle='#FAC775';ctx.lineWidth=10;ctx.beginPath();ctx.arc(f.cx,f.cy,f.r-8,-Math.PI/2,-Math.PI/2+6.283*T.power);ctx.stroke();}
  if(T.lastPower>=0&&!T.charging){const a=-Math.PI/2+6.283*T.lastPower;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(f.cx+Math.cos(a)*(f.r-8),f.cy+Math.sin(a)*(f.r-8),5,0,6.3);ctx.fill();}
  otxt(T.reload>0?'장전':(T.charging?Math.round(T.power*100)+'':'발사'),f.cx,f.cy,T.charging?34:28,'#fff','center');
}
function drawBanner(){
  const b=G.banner,al=clamp(Math.min(1,b.t/0.4,(2.4-b.t)/0.3+0.2),0,1);ctx.globalAlpha=al;
  panel(W/2-290,118,580,80,0.62);
  otxt(b.a,W/2,146,28,'#fff','center');if(b.b)txt(b.b,W/2,178,14,'#ddd','center',400);ctx.globalAlpha=1;
}
function shade(){ctx.fillStyle='rgba(10,14,18,0.68)';ctx.fillRect(0,0,W,H);}
function drawCards(){
  shade();otxt(G.level===1&&G.t<1?'출격 준비 — 첫 무기를 고르세요':'레벨 업! 업그레이드를 하나 고르세요',W/2,150,28,'#fff','center');txt(touchMode?'원하는 카드를 터치하세요':'클릭하거나 1 · 2 · 3 키',W/2,184,14,'#bbb','center',400);
  const rs=cardRects();
  G.cards.forEach((c,i)=>{const r=rs[i],inf=cardInfo(c);
    ctx.fillStyle='#1f262d';rr(r.x,r.y,r.w,r.h,14);ctx.fill();
    const g=ctx.createLinearGradient(0,r.y,0,r.y+120);g.addColorStop(0,inf.col+'55');g.addColorStop(1,inf.col+'00');ctx.fillStyle=g;rr(r.x,r.y,r.w,120,14);ctx.fill();
    ctx.strokeStyle=inf.col;ctx.lineWidth=c.kind==='evo'?4:2;rr(r.x,r.y,r.w,r.h,14);ctx.stroke();
    ctx.fillStyle=inf.col;rr(r.x+20,r.y+22,Math.max(90,inf.tag.length*13+20),28,14);ctx.fill();
    txt(inf.tag,r.x+32,r.y+36,14,'#fff','left');
    const ik=c.kind==='heal'?'w11':ICON[c.id];
    sprFit(ik,r.x+r.w-58,r.y+70,64);
    otxt(inf.title,r.x+20,r.y+118,26,'#fff','left');txt(inf.sub,r.x+20,r.y+150,14,inf.col,'left',400);
    wrap(inf.desc,r.x+20,r.y+196,r.w-40,16,'#ddd');
    txt(String(i+1),r.x+r.w-26,r.y+r.h-24,18,'#777','center');
  });
}
function wrap(s,x,y,maxW,size,col){ctx.font='400 '+size+'px '+FONT;const words=s.split(' ');let line='';for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){txt(line,x,y,size,col,'left',400);line=w;y+=size*1.6;}else line=t;}if(line)txt(line,x,y,size,col,'left',400);}
function drawTitle(){
  drawBg();if(tDirty||!tCanvas)rebuildTerrain();ctx.drawImage(tCanvas,0,0);
  const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(10,14,18,0.85)');g.addColorStop(0.75,'rgba(10,14,18,0.55)');g.addColorStop(1,'rgba(10,14,18,0.2)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const hasM=spr('mascot',W-250,H-230,300,false,0)||spr('hero',W-260,H-235,230,false,0);
  const cx=hasM?470:W/2,al=hasM?'center':'center';
  otxt('포트리스 서바이버',cx,160,58,'#fff',al);
  txt('프로토타입 v0.4 — 오른쪽에서 몰려오는 적을 포격으로 막아내세요',cx,222,17,'#ddd',al,400);
  const L=touchMode?[['◀ ▶','왼쪽 아래 버튼: 이동 (이동 중 재장전 느림)'],['▲ ▼','오른쪽 버튼: 각도 (톡 1°, 길게 누르면 연속)'],['발사','누르고 있으면 파워 충전, 떼면 발사'],['카드','레벨업 때 원하는 카드를 터치'],['II','오른쪽 위 버튼: 일시정지']]:[['← →','이동 (이동 중에는 재장전이 느려짐)'],['↑ ↓','각도 조절 (Shift: 정밀 조절)'],['Space','누르고 있으면 파워 충전, 떼면 발사 (마우스 클릭도 가능)'],['1 2 3','레벨업 카드 선택'],['P / M','일시정지 / 소리 켜고 끄기']];
  L.forEach((l,i)=>{txt(l[0],cx-200,296+i*36,17,'#FAC775','right');txt(l[1],cx-176,296+i*36,16,'#eee','left',400);});
  txt('바람을 읽고 각도와 파워를 맞추세요. 포격으로 구덩이를 파면 적이 느려집니다.',cx,500,15,'#9FE1CB',al,400);
  otxt(touchMode?'화면을 터치해서 시작':'Enter 또는 클릭으로 시작',cx,566,22,'#fff',al);
}
function drawEnd(win){
  shade();otxt(win?'기지 방어 성공!':'작전 실패',W/2,220,52,win?'#9FE1CB':'#F09595','center');
  if(!win)txt(G.msg,W/2,276,18,'#ddd','center',400);
  const sec=Math.floor(G.t);
  const S=[['도달 웨이브',G.wave+' / 20'],['처치',G.kills],['레벨',G.level],['생존 시간',Math.floor(sec/60)+'분 '+(sec%60)+'초']];
  S.forEach((s,i)=>{txt(s[0],W/2-20,340+i*36,18,'#bbb','right',400);txt(String(s[1]),W/2+20,340+i*36,18,'#fff','left');});
  otxt(touchMode?'터치해서 다시 시작':'Enter 또는 클릭으로 다시 시작',W/2,540,20,'#fff','center');
}
function draw(){
  if(!G){drawTitle();return;}
  ctx.save();if(G.shake>0||G.kickX||G.kickY){const s=G.shake;ctx.translate(W/2+rand(-s,s)+G.kickX,H/2+rand(-s,s)+G.kickY);ctx.rotate(rand(-1,1)*s*0.0012);ctx.translate(-W/2,-H/2);}
  drawBg();drawTerrain();drawBase();drawEnemies();drawTank();drawPreview();drawShells();drawMisc();
  ctx.restore();
  if(G.hurtFlash>0){const a=Math.min(0.55,G.hurtFlash),vg=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.95);vg.addColorStop(0,'rgba(226,40,40,0)');vg.addColorStop(1,'rgba(226,40,40,'+a+')');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);}
  drawHud();if(touchMode&&G.state==='play')drawTouch();if(G.banner&&G.state!=='levelup')drawBanner();
  if(G.state==='levelup')drawCards();
  if(G.state==='paused'){shade();otxt('일시정지',W/2,H/2-20,44,'#fff','center');txt(touchMode?'터치해서 계속':'P 키를 눌러 계속',W/2,H/2+30,18,'#ddd','center',400);}
  if(G.state==='over')drawEnd(false);
  if(G.state==='win')drawEnd(true);
}

/* ---------- 입력 ---------- */
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.code==='KeyM'){muted=!muted;initAudio();}
  if(!G||G.state==='over'||G.state==='win'){if(e.code==='Enter'||e.code==='KeyR'||(!G&&e.code==='Space'&&!e.repeat))newGame();return;}
  if(G.state==='play'){if(e.code==='Space'&&!e.repeat)startCharge();if(e.code==='KeyP'||e.code==='Escape'){G.state='paused';G.tank.charging=false;}}
  else if(G.state==='paused'){if(e.code==='KeyP'||e.code==='Escape')G.state='play';}
  else if(G.state==='levelup'){const i=['Digit1','Digit2','Digit3','Numpad1','Numpad2','Numpad3'].indexOf(e.code);if(i>=0)chooseCard(i%3);}
});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Space'&&G)releaseCharge();});
addEventListener('blur',()=>{keys={};ptrs.clear();if(G&&G.state==='play'){G.tank.charging=false;G.state='paused';}});
function canvasPos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function tryFullscreen(){if(!touchMode)return;try{const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen({navigationUI:'hide'}).then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}catch(e){}}
const ptrs=new Map();
function hitBtn(p){
  const B=touchBtns();
  for(const k in B){const b=B[k];if(b.r!==undefined){if(dist(p.x,p.y,b.cx,b.cy)<=b.r+12)return k;}else if(p.x>=b.x-8&&p.x<=b.x+b.w+8&&p.y>=b.y-8&&p.y<=b.y+b.h+8)return k;}
  return null;
}
function pressBtn(k){
  const T=G.tank,now=performance.now();
  if(k==='L')keys.TouchL=true;else if(k==='R')keys.TouchR=true;
  else if(k==='U'){keys.TouchU=now;T.angle=clamp(Math.round(T.angle)+1,0,88);}
  else if(k==='D'){keys.TouchD=now;T.angle=clamp(Math.round(T.angle)-1,0,88);}
  else if(k==='F')startCharge();
  else if(k==='P'){G.state='paused';T.charging=false;}
  else if(k==='M'){muted=!muted;initAudio();}
}
function releaseBtn(k){
  if(k==='L')keys.TouchL=false;else if(k==='R')keys.TouchR=false;
  else if(k==='U')keys.TouchU=0;else if(k==='D')keys.TouchD=0;
  else if(k==='F')releaseCharge();
}
cv.addEventListener('pointerdown',e=>{
  if(AC&&AC.state==='suspended')AC.resume();
  if(e.pointerType==='touch'||e.pointerType==='pen')touchMode=true;
  e.preventDefault();cv.focus();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const p=canvasPos(e);
  if(!G||G.state==='over'||G.state==='win'){tryFullscreen();newGame();return;}
  if(G.state==='levelup'){cardRects().forEach((r,i)=>{if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h)chooseCard(i);});return;}
  if(G.state==='paused'){G.state='play';return;}
  if(e.pointerType!=='mouse'){const k=hitBtn(p);if(k&&G.state==='play'){ptrs.set(e.pointerId,k);pressBtn(k);}return;}
  if(e.button===0){const k=touchMode?hitBtn(p):null;if(k){ptrs.set(e.pointerId,k);pressBtn(k);}else startCharge();}
},{passive:false});
function endPtr(e){const k=ptrs.get(e.pointerId);if(k){ptrs.delete(e.pointerId);if(G)releaseBtn(k);}else if(e.pointerType==='mouse'&&G)releaseCharge();}
addEventListener('pointerup',endPtr);addEventListener('pointercancel',endPtr);
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&G.state==='play'){G.state='paused';G.tank.charging=false;}});

let last=performance.now();
function frame(now){const dt=Math.min(0.033,(now-last)/1000);last=now;if(G)update(dt);draw();requestAnimationFrame(frame);}
buildSprites();genTerrain();requestAnimationFrame(frame);
</script>
